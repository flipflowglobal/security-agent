[package]
name = "security-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Defensive and offensive security orchestration agent for authorized vulnerability and penetration testing."
license = "MIT"
repository = "https://github.com/flipflowglobal/security-agent"

# Core orchestration logic uses no external runtime crates — JSON, SHA-256,
# and PCAP parsing are all implemented in-house (see `src/json.rs`,
# `src/builtin_tools.rs`, `src/pcap.rs`).
[dependencies]

# Inference back-end (optional — not required for the core orchestration logic).
# Enable with `cargo build --features inference` when the ML inference path is ready.
candle = { package = "candle-core", version = "0.9.2", default-features = false, optional = true }
candle-transformers = { version = "0.9.2", default-features = false, optional = true }
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"], optional = true }

[features]
# Enable the candle-based LLM inference back-end.
inference = ["dep:candle", "dep:candle-transformers", "dep:tokenizers"]
