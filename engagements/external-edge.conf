# =============================================================================
# security-agent — engagement: external-edge
# Fully automated external web-edge assessment: discovery drives exploitation.
# =============================================================================
# Target chain (all RFC 5737 documentation addresses — swap in real scope):
#
#   edge-gateway (Infrastructure, 203.0.113.0/24)  -> nmap + masscan discover
#                                                     live hosts + open services
#   edge-www     (WebApp,        203.0.113.10)     -> Dast: whatweb, wafw00f,
#                                                     nikto, nuclei, wpscan,
#                                                     gobuster, ffuf, skipfish,
#                                                     burpsuite
#   edge-api     (Api,           203.0.113.20)     -> ApiSecurity: mitmproxy,
#                                                     burpsuite, ffuf, wfuzz,
#                                                     nuclei
#
# AUTOMATION (result-driven expansion, on by default; disable with --no-expand):
#   Every discovered asset feeds the next round automatically:
#     * nmap/masscan XML  -> open services, keyed by host
#     * HTTP(S) services  -> whatweb, wafw00f, nikto, nuclei, wpscan, gobuster,
#                            feroxbuster, sqlmap proposed on the discovered host
#     * gobuster/ffuf     -> discovered URLs, which seed more web scans
#   Expansion only RUNS tools the active-tool gate approves (the plan's
#   specialist tool sets, narrowed by --allow-tool/--deny-tool), so the gate
#   must be told about tools outside those sets (e.g. sqlmap, feroxbuster)
#   -- they are proposed but refused before spawn otherwise.
#
# Live network traffic requires the explicit per-invocation --allow-network
# opt-in AND these in-scope addresses. Do not point this at anything you do
# not own or have written permission to test.
# -----------------------------------------------------------------------------

# --- Who authorized this, and what it is ------------------------------------
engagement_id=eng-2026-external-edge
authorized_by=jane.doe
authorized_by_role=SecurityAdmin

# --- When the work is allowed to happen (Unix epoch seconds) -----------------
# Window below: 2026-08-13 .. 2026-08-27 (UTC). Regenerate with `date +%s`.
time_window_start=1786604248
time_window_end=1787813848

# --- Scope: what may be touched, and what must never be ----------------------
in_scope_targets=edge-gateway,edge-www,edge-api
deny_list_targets=corp-prod

# --- What kinds of testing are approved (comma-separated) --------------------
allowed_techniques=PassiveRecon,ConfigurationAudit,Dast,ApiSecurity,ThreatModeling,AttackPathAnalysis

# --- How hard the engine may push -------------------------------------------
# max_intensity: Passive | Standard | Aggressive
max_intensity=Standard
high_impact_approved=false
# Dast and ApiSecurity are active/penetrative techniques — required sign-off.
penetrative_testing_approved=true

# =============================================================================
# Targets
# =============================================================================
# network_address accepts a CIDR: declaring 203.0.113.0/24 puts EVERY host the
# discovery stage finds in that range into scope for follow-up tools (a bare
# IP would scope follow-ups to exactly that address).

[target]
id=edge-gateway
target_type=Infrastructure
criticality=3
network_address=203.0.113.0/24

[target]
id=edge-www
target_type=WebApp
criticality=4
network_address=203.0.113.10

[target]
id=edge-api
target_type=Api
criticality=4
network_address=203.0.113.20

# =============================================================================
# Recommended run (one-shot automation with full artifact trail)
# =============================================================================
#   security-agent --run-engagement engagements/external-edge.conf \
#       --allow-network \
#       --max-concurrency 4 \
#       --per-tool-timeout 300 \
#       --min-spawn-interval 2 \
#       --secrets engagements/secrets.example.env \
#       --events engagements/events-edge.jsonl \
#       --findings-log engagements/findings-edge.jsonl \
#       --audit-log engagements/audit-edge.jsonl \
#       --report-out engagements/report-edge.md \
#       --report-format markdown \
#       --control-file engagements/control.txt
#
#   # steer the run live from another terminal:
#   security-agent --engagement-control engagements/control.txt pause
#   security-agent --engagement-control engagements/control.txt rate 5
#   security-agent --engagement-control engagements/control.txt cancel
#
#   # plan only (offline, safe) or plan + run installed local tools:
#   security-agent --plan-scan engagements/external-edge.conf
#   security-agent --plan-scan engagements/external-edge.conf --execute -sV
#
# Operator arguments after `--` are appended to EVERY tool invocation, so put
# only tool-agnostic flags there (e.g. -- --json for JSON output), or leave
# the list empty and pass per-tool flags through --run-external-tool instead:
#   security-agent --run-external-tool --allow-network sqlmap -u http://203.0.113.10/... --batch
