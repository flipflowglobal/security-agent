# =============================================================================
# security-agent — engagement: internal-active-directory
# Lab internal-network assessment: subnet discovery + service mapping + web
# scanning of discovered hosts, with a documented credential-testing path.
# =============================================================================
# Target chain (RFC 1918 lab range — swap in your own authorized scope):
#
#   lab-dmz  (Infrastructure, 192.168.56.0/24)  -> nmap + masscan enumerate
#                                                  every live host in scope;
#                                                  the /24 CIDR puts all
#                                                  discovered hosts in scope
#                                                  for follow-up tools
#   lab-web  (WebApp,         192.168.56.20)    -> Dast web scanning
#
# AUTOMATION (result-driven expansion, on by default):
#   Open services feed protocol-specific follow-ups automatically:
#     * 80/443/3xxx/8xxx  -> whatweb, wafw00f, nikto, nuclei, wpscan,
#                            gobuster, feroxbuster, sqlmap (proposed)
#     * 139/445 (SMB)     -> enum4linux, smbmap, crackmapexec, netexec
#     * 22/23 (SSH/telnet)-> hydra, ncrack      * 3389 (RDP) -> ncrack, CME
#     * 389/636 (LDAP)    -> enum4linux         * 5985/5986 (WinRM) -> evil-winrm, netexec
#   Expansion RUNS only gate-approved tools. The web follow-ups above are
#   approved here via the Dast tool set; the SMB/credential tools are cataloged
#   and proposed but are NOT in any specialist tool set, so they are refused
#   before spawn unless you run them manually (see below) -- the gate never
#   widens, and --allow-tool only narrows it further.
#
#   Manual credential-testing path (cataloged tools, run directly):
#     security-agent --run-external-tool --allow-network nmap -sV -p- 192.168.56.20
#     security-agent --run-external-tool --allow-network enum4linux 192.168.56.20
#     security-agent --run-external-tool --allow-network hydra -l admin -P wordlist.txt ssh://192.168.56.20
#     security-agent --run-external-tool --allow-network crackmapexec smb 192.168.56.0/24 -u user -p pass
#
# SAFETY: live traffic ONLY with --allow-network + in-scope addresses. This
# engagement targets a lab range; never point it at production.
# -----------------------------------------------------------------------------

# --- Who authorized this, and what it is ------------------------------------
engagement_id=eng-2026-internal-ad
authorized_by=sam.lee
authorized_by_role=SecurityEngineer

# --- When the work is allowed to happen (Unix epoch seconds) -----------------
# Window below: 2026-08-13 .. 2026-08-27 (UTC). Regenerate with `date +%s`.
time_window_start=1786604248
time_window_end=1787813848

# --- Scope: what may be touched, and what must never be ----------------------
in_scope_targets=lab-dmz,lab-web
deny_list_targets=corp-core,corp-prod

# --- What kinds of testing are approved (comma-separated) --------------------
allowed_techniques=PassiveRecon,ConfigurationAudit,Dast,ThreatModeling,AttackPathAnalysis

# --- How hard the engine may push -------------------------------------------
# max_intensity: Passive | Standard | Aggressive
max_intensity=Standard
high_impact_approved=false
# Dast is active/penetrative — required sign-off.
penetrative_testing_approved=true

# =============================================================================
# Targets
# =============================================================================

[target]
id=lab-dmz
target_type=Infrastructure
criticality=3
network_address=192.168.56.0/24

[target]
id=lab-web
target_type=WebApp
criticality=4
network_address=192.168.56.20

# =============================================================================
# Recommended run (one-shot automation with full artifact trail)
# =============================================================================
#   security-agent --run-engagement engagements/internal-active-directory.conf \
#       --allow-network \
#       --max-concurrency 4 \
#       --per-tool-timeout 600 \
#       --min-spawn-interval 3 \
#       --secrets engagements/secrets.example.env \
#       --events engagements/events-ad.jsonl \
#       --findings-log engagements/findings-ad.jsonl \
#       --audit-log engagements/audit-ad.jsonl \
#       --report-out engagements/report-ad.json \
#       --report-format json \
#       --control-file engagements/control.txt
#
#   # plan only (offline, safe):
#   security-agent --plan-scan engagements/internal-active-directory.conf
