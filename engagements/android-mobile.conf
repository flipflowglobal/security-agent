# =============================================================================
# security-agent — engagement: android-mobile
# Static + runtime analysis of an Android APK (label-only, no network).
# =============================================================================
# Feed this to the planner:
#
#     security-agent --plan-scan engagements/android-mobile.conf
#     security-agent --plan-scan engagements/android-mobile.conf \
#         --audit-log engagements/audit-android.jsonl
#     security-agent --run-engagement engagements/android-mobile.conf \
#         --findings-log engagements/findings-android.jsonl
#
# This engagement has NO network_address on any target, so it is label-only:
# static analyzers (jadx, apktool, mobsf, semgrep, ...) run offline; nothing
# leaves the machine even with --allow-network present.
#
# Techniques: AndroidStaticAnalysis (APK/DEX bytecode), SecretScan (leaked
# keys), DependencyAudit (vulnerable libs), MobileRuntime (Frida/objection —
# active, requires penetrative approval).
# -----------------------------------------------------------------------------

# --- Who authorized this, and what it is ------------------------------------
engagement_id=eng-2026-android-mobile
authorized_by=jane.doe
authorized_by_role=SecurityAdmin

# --- When the work is allowed to happen (Unix epoch seconds) -----------------
# Window below: 2026-08-13 .. 2026-08-27 (UTC). Regenerate with `date +%s`.
time_window_start=1786604248
time_window_end=1787813848

# --- Scope: what may be touched, and what must never be ----------------------
in_scope_targets=shopping-app,wallet-app
deny_list_targets=production-app

# --- What kinds of testing are approved (comma-separated) --------------------
allowed_techniques=AndroidStaticAnalysis,SecretScan,DependencyAudit,MobileRuntime

# --- How hard the engine may push -------------------------------------------
max_intensity=Standard
high_impact_approved=false
# MobileRuntime is an active/penetrative technique — required sign-off.
penetrative_testing_approved=true

# =============================================================================
# Targets
# =============================================================================

[target]
id=shopping-app
target_type=MobileApp
criticality=4

[target]
id=wallet-app
target_type=MobileApp
criticality=5
