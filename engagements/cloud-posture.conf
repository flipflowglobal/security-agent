# =============================================================================
# security-agent — engagement: cloud-posture
# Cloud/container misconfiguration audit + dependency & secret scanning.
# Label-only: no network_address, so nothing leaves the machine.
# =============================================================================
# Feed this to the planner:
#
#     security-agent --plan-scan engagements/cloud-posture.conf
#     security-agent --plan-scan engagements/cloud-posture.conf \
#         --audit-log engagements/audit-cloud.jsonl
#     security-agent --run-engagement engagements/cloud-posture.conf \
#         --findings-log engagements/findings-cloud.jsonl
#
# All techniques here are static/local-analysis (CloudPosture, ContainerPosture,
# DependencyAudit, SecretScan, ConfigurationAudit, ThreatModeling,
# AttackPathAnalysis) — no penetrative testing is approved.
# -----------------------------------------------------------------------------

# --- Who authorized this, and what it is ------------------------------------
engagement_id=eng-2026-cloud-posture
authorized_by=jane.doe
authorized_by_role=SecurityAdmin

# --- When the work is allowed to happen (Unix epoch seconds) -----------------
# Window below: 2026-08-13 .. 2026-08-27 (UTC). Regenerate with `date +%s`.
time_window_start=1786604248
time_window_end=1787813848

# --- Scope: what may be touched, and what must never be ----------------------
in_scope_targets=prod-k8s,infra-repo
deny_list_targets=legacy-aws

# --- What kinds of testing are approved (comma-separated) --------------------
allowed_techniques=CloudPosture,ContainerPosture,DependencyAudit,SecretScan,ConfigurationAudit,ThreatModeling,AttackPathAnalysis

# --- How hard the engine may push -------------------------------------------
max_intensity=Passive
high_impact_approved=false
penetrative_testing_approved=false

# =============================================================================
# Targets
# =============================================================================

[target]
id=prod-k8s
target_type=Container
criticality=5

[target]
id=infra-repo
target_type=SourceCode
criticality=3
