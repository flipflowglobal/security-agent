# =============================================================================
# security-agent — engagement: infrastructure-recon
# Passive reconnaissance + configuration audit of lab hosts. NO exploitation.
# =============================================================================
# Feed this to the planner:
#
#     security-agent --plan-scan engagements/infrastructure-recon.conf
#     security-agent --plan-scan engagements/infrastructure-recon.conf \
#         --audit-log engagements/audit-recon.jsonl --execute
#     security-agent --run-engagement engagements/infrastructure-recon.conf \
#         --allow-network --findings-log engagements/findings-recon.jsonl
#
# Intensity is capped at Passive: only passive/read-only tools (nmap -sP/-sT
# banner grab, whatweb, dns enumeration) are planned. penetrative_testing
# is NOT approved, so no active exploitation tool can be scheduled.
# -----------------------------------------------------------------------------

# --- Who authorized this, and what it is ------------------------------------
engagement_id=eng-2026-infra-recon
authorized_by=sam.lee
authorized_by_role=SecurityEngineer

# --- When the work is allowed to happen (Unix epoch seconds) -----------------
# Window below: 2026-08-13 .. 2026-08-27 (UTC). Regenerate with `date +%s`.
time_window_start=1786604248
time_window_end=1787813848

# --- Scope: what may be touched, and what must never be ----------------------
in_scope_targets=dmz-01,dmz-02
deny_list_targets=corp-core

# --- What kinds of testing are approved (comma-separated) --------------------
allowed_techniques=PassiveRecon,ConfigurationAudit

# --- How hard the engine may push -------------------------------------------
# max_intensity: Passive | Standard | Aggressive
max_intensity=Passive
high_impact_approved=false
penetrative_testing_approved=false

# =============================================================================
# Targets
# =============================================================================

[target]
id=dmz-01
target_type=Infrastructure
criticality=3
network_address=192.168.56.30

[target]
id=dmz-02
target_type=Infrastructure
criticality=2
network_address=192.168.56.31
