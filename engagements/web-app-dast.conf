# =============================================================================
# security-agent — engagement: web-app-dast
# Web application + API penetration test against staging hosts (lab range).
# =============================================================================
# Feed this to the planner:
#
#     security-agent --plan-scan engagements/web-app-dast.conf
#     security-agent --plan-scan engagements/web-app-dast.conf \
#         --audit-log engagements/audit-web-app.jsonl --execute -sV
#     security-agent --run-engagement engagements/web-app-dast.conf \
#         --allow-network --secrets examples/secrets.example.env \
#         --findings-log engagements/findings-web-app.jsonl
#
# Format rules (see examples/engagement.example.conf):
#   * one  key=value  per line;  # comments and blank lines are ignored
#   * comments must be on their OWN line (no trailing # after a value)
#   * one or more  [target]  sections follow the header
#
# SAFETY: planning is offline. Live traffic goes out ONLY with --allow-network
# AND a target carrying a real network_address. The addresses below are
# RFC-1918 lab hosts (192.168.56.x) — do not point them at anything you do not
# own. `penetrative_testing_approved=true` enables the active web techniques
# (Dast, ApiSecurity) listed below.
# -----------------------------------------------------------------------------

# --- Who authorized this, and what it is ------------------------------------
engagement_id=eng-2026-web-dast
authorized_by=jane.doe
# authorized_by_role: SecurityAdmin | SecurityEngineer | Auditor | Viewer
authorized_by_role=SecurityAdmin

# --- When the work is allowed to happen (Unix epoch seconds) -----------------
# Window below: 2026-08-13 .. 2026-08-27 (UTC). Regenerate with `date +%s`.
time_window_start=1786604248
time_window_end=1787813848

# --- Scope: what may be touched, and what must never be ----------------------
# in_scope_targets must list every target id in the [target] sections below.
in_scope_targets=api-staging,web-staging
deny_list_targets=prod-ledger

# --- What kinds of testing are approved (comma-separated) --------------------
allowed_techniques=PassiveRecon,ConfigurationAudit,Sast,Dast,ApiSecurity,DependencyAudit,SecretScan

# --- How hard the engine may push -------------------------------------------
# max_intensity: Passive | Standard | Aggressive
max_intensity=Standard
# high_impact_approved: true only with explicit sign-off.
high_impact_approved=false
# penetrative_testing_approved: required for Dast/ApiSecurity — both are
# enabled above, so this must be true.
penetrative_testing_approved=true

# =============================================================================
# Targets
# =============================================================================
# network_address is OPTIONAL. Set it ONLY when you intend to run live tools
# (nmap, masscan, sqlmap, ...) against the host with --allow-network.

[target]
id=api-staging
target_type=Api
criticality=4
network_address=192.168.56.10

[target]
id=web-staging
target_type=WebApp
criticality=3
network_address=192.168.56.20
