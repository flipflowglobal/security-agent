# =============================================================================
# MASTER FULL-SCOPE ENGAGEMENT CONFIG — `--plan-scan` / `--run-engagement`
# =============================================================================
# PURPOSE
#   A single configuration that declares FULL AUTHORIZATION for every
#   capability the security-agent supports: every target type and every
#   technique, at the highest intensity, for a wide testing window.
#   Use it as the starting point for a fully-scoped penetration test or red
#   team engagement ("capability + real testing + real security ops").
#
# HOW "FULL AUTHORIZATION" WORKS HERE
#   This file does NOT bypass the policy engine. It *satisfies* every gate:
#     - authorized_by_role = SecurityAdmin (highest privilege role)
#     - time_window        = every approved run inside 2026-08-01..2027-01-31
#     - in_scope_targets   = every [target] id below is explicitly in scope
#     - allowed_techniques = all 15 techniques explicitly approved
#     - max_intensity      = Aggressive (the highest declared ceiling)
#     - high_impact_approved / penetrative_testing_approved = true
#   Authorization failures are still enforced and reported by the engine;
#   the audit trail still records every planned action.
#
# OPERATOR RESPONSIBILITIES (REQUIRED BEFORE EXECUTION)
#   [ ] You hold written authorization covering every target below.
#   [ ] The time window above matches the approved testing window.
#   [ ] Live/network tool execution additionally requires the per-invocation
#       --allow-network opt-in (offline-by-default is an invariant).
#   [ ] Targets marked 10.10.0.0/24 are RFC1918 placeholders -- replace them
#       with the real, authorized addresses/CIDRs of YOUR engagement.
#
# DO NOT RUN THIS AGAINST SYSTEMS YOU ARE NOT EXPLICITLY AUTHORIZED TO TEST.
# =============================================================================

engagement_id=eng-full-scope-2026
authorized_by=SECURITY_ADMIN_SIGNER
authorized_by_role=SecurityAdmin
time_window_start=1785542400
time_window_end=1801439999

# Every target id below is in scope.
in_scope_targets=web-app,api-gateway,mobile-backend,android-app,cloud-account,blockchain-node,container-registry,infra-segment,app-source,dependency-tree

# All 15 techniques are explicitly approved.
allowed_techniques=PassiveRecon,ConfigurationAudit,Sast,Dast,ApiSecurity,DependencyAudit,CloudPosture,ContainerPosture,SecretScan,MalwareScan,ThreatModeling,AttackPathAnalysis,ExploitValidationSandboxed,AndroidStaticAnalysis,MobileRuntime

# No deny-list: every listed target is authorized. Add deny_list_targets=
# to carve out anything that must NOT be touched.
deny_list_targets=

max_intensity=Aggressive
high_impact_approved=true
penetrative_testing_approved=true

# -----------------------------------------------------------------------------
# Targets (one per supported TargetType)
# -----------------------------------------------------------------------------

[target]
id=web-app
target_type=WebApp
criticality=5
network_address=10.10.0.10

[target]
id=api-gateway
target_type=Api
criticality=5
network_address=10.10.0.11

[target]
id=mobile-backend
target_type=MobileBackend
criticality=4
network_address=10.10.0.12

[target]
id=android-app
target_type=MobileApp
criticality=4

[target]
id=cloud-account
target_type=Cloud
criticality=5

[target]
