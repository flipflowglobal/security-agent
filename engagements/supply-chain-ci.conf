# =============================================================================
# security-agent — engagement: supply-chain-ci
# Offline supply-chain + posture audit: source, dependencies, container, cloud.
# Safe to run in CI: NO network addresses, NO --allow-network, no egress.
# =============================================================================
# Target chain (all label-only static analysis — nothing leaves the machine):
#
#   app-repo      (SourceCode)          -> Sast:      semgrep, qark,
#                                                     mariana-trench, trueseeing,
#                                                     androguard
#                                        -> SecretScan: apkleaks, semgrep
#                                        -> MalwareScan: chkrootkit, binwalk,
#                                                     bulk_extractor, foremost,
#                                                     volatility, autopsy
#   app-manifests (DependencyManifest)  -> DependencyAudit: searchsploit, hashdeep
#   app-image     (Container)           -> ContainerPosture: lynis, chkrootkit,
#                                                     hashdeep
#   app-cloud     (Cloud)               -> CloudPosture: lynis, chkrootkit
#
# CI automation notes:
#   * Offline by design: no [target] has network_address and no run flag
#     passes --allow-network, so only StaticLocalAnalysis steps execute.
#   * Findings land in an append-only JSONL log and/or the SARIF/JSON/Markdown
#     deliverable -- wire --report-out straight into your CI artifacts.
#   * Missing logs are treated as empty history, so re-runs are idempotent.
# -----------------------------------------------------------------------------

# --- Who authorized this, and what it is ------------------------------------
engagement_id=eng-2026-supply-chain
authorized_by=ci.robot
authorized_by_role=Auditor

# --- When the work is allowed to happen (Unix epoch seconds) -----------------
# Window below: 2026-08-13 .. 2026-08-27 (UTC). Regenerate with `date +%s`.
time_window_start=1786604248
time_window_end=1787813848

# --- Scope: what may be touched, and what must never be ----------------------
in_scope_targets=app-repo,app-manifests,app-image,app-cloud
deny_list_targets=third-party-unverified

# --- What kinds of testing are approved (comma-separated) --------------------
allowed_techniques=Sast,SecretScan,MalwareScan,DependencyAudit,ContainerPosture,CloudPosture,ConfigurationAudit,ThreatModeling,AttackPathAnalysis

# --- How hard the engine may push -------------------------------------------
# max_intensity: Passive | Standard | Aggressive
max_intensity=Passive
high_impact_approved=false
# No active/penetrative techniques are approved — static analysis only.
penetrative_testing_approved=false

# =============================================================================
# Targets
# =============================================================================

[target]
id=app-repo
target_type=SourceCode
criticality=4

[target]
id=app-manifests
target_type=DependencyManifest
criticality=3

[target]
id=app-image
target_type=Container
criticality=4

[target]
id=app-cloud
target_type=Cloud
criticality=3

# =============================================================================
# Recommended runs (all fully offline)
# =============================================================================
#   security-agent --plan-scan engagements/supply-chain-ci.conf
#
#   security-agent --run-engagement engagements/supply-chain-ci.conf \
#       --max-concurrency 2 \
#       --findings-log engagements/findings-ci.jsonl \
#       --audit-log engagements/audit-ci.jsonl \
#       --report-out engagements/report-ci.sarif \
#       --report-format sarif
#
#   # view the persisted findings / merge a second run's log / schedule retests:
#   security-agent --view-audit engagements/audit-ci.jsonl
#   security-agent --record-findings engagements/findings-ci-all.jsonl engagements/findings-ci.jsonl
#   security-agent --schedule-retest engagements/findings-ci.jsonl
