# =============================================================================
# security-agent — engagement: mobile-full-stack
# Android APK static/runtime analysis + the mobile backend API surface.
# =============================================================================
# Target chain:
#
#   android-app  (MobileApp)      -> AndroidStaticAnalysis + MobileRuntime +
#                                    SecretScan + DependencyAudit
#                                    approved tools: apktool, jadx, mobsf,
#                                    androguard, frida, objection, apkleaks,
#                                    apksigner, dex2jar, drozer, qark,
#                                    mariana-trench, trueseeing, nuclei, semgrep
#   mobile-api   (MobileBackend)  -> ApiSecurity: mitmproxy, burpsuite, ffuf,
#                                    wfuzz, nuclei  + the android tool set above
#
# The MobileApp target has NO network_address, so it is label-only: APK
# analyzers are local-file tools and never leave the machine. The backend API
# carries an address so live API testing can bind to it when --allow-network
# is given.
#
# MobileRuntime (frida/objection/drozer) is ACTIVE instrumentation — it needs
# a device/emulator reachable through the environment (adb forwarding etc.).
# It is approved here via penetrative_testing_approved=true.
# -----------------------------------------------------------------------------

# --- Who authorized this, and what it is ------------------------------------
engagement_id=eng-2026-mobile-stack
authorized_by=jane.doe
authorized_by_role=SecurityAdmin

# --- When the work is allowed to happen (Unix epoch seconds) -----------------
# Window below: 2026-08-13 .. 2026-08-27 (UTC). Regenerate with `date +%s`.
time_window_start=1786604248
time_window_end=1787813848

# --- Scope: what may be touched, and what must never be ----------------------
in_scope_targets=android-app,mobile-api
deny_list_targets=production-app

# --- What kinds of testing are approved (comma-separated) --------------------
allowed_techniques=AndroidStaticAnalysis,MobileRuntime,SecretScan,DependencyAudit,ApiSecurity,ConfigurationAudit,PassiveRecon

# --- How hard the engine may push -------------------------------------------
# max_intensity: Passive | Standard | Aggressive
max_intensity=Standard
high_impact_approved=false
# MobileRuntime is active/penetrative — required sign-off.
penetrative_testing_approved=true

# =============================================================================
# Targets
# =============================================================================

[target]
id=android-app
target_type=MobileApp
criticality=4

[target]
id=mobile-api
target_type=MobileBackend
criticality=5
network_address=192.168.56.40

# =============================================================================
# Recommended runs
# =============================================================================
# Static-only pass (offline, no --allow-network needed): every Android tool is
# a local analyzer, so this automates the whole APK review with no egress.
# Operator args appended to EVERY tool, so keep them tool-agnostic; the APK
# path is normally supplied per tool via --run-external-tool (see below).
#
#   security-agent --run-engagement engagements/mobile-full-stack.conf \
#       --findings-log engagements/findings-mobile.jsonl \
#       --audit-log engagements/audit-mobile.jsonl \
#       --report-out engagements/report-mobile.md \
#       --report-format markdown
#
# Direct per-tool runs (APK path + device targeting belong here):
#   security-agent --run-external-tool apktool d <apk> -o out/
#   security-agent --run-external-tool jadx -d out/sources <apk>
#   security-agent --run-external-tool mobsf -f <apk> -o out/
#   security-agent --run-external-tool apkleaks -f <apk> -o out/
#   security-agent --run-external-tool semgrep --config p/security-audit out/sources
#   security-agent --run-external-tool objection -g <package> explore
#   security-agent --run-external-tool drozer console connect
#
# Live API stage (requires --allow-network; binds to 192.168.56.40):
#   security-agent --run-engagement engagements/mobile-full-stack.conf \
#       --allow-network --max-concurrency 3 --min-spawn-interval 2 \
#       --findings-log engagements/findings-mobile-api.jsonl \
#       --report-out engagements/report-mobile-api.md
