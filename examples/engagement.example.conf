# =============================================================================
# security-agent — example engagement configuration
# =============================================================================
# Copy this file, edit the values, and feed it to the planner:
#
#     security-agent --plan-scan     my-engagement.conf
#     security-agent --run-engagement my-engagement.conf
#
# Format rules (kept deliberately simple):
#   * one  key=value  per line
#   * lines starting with #  and blank lines are ignored
#   * comments must be on their OWN line (no trailing #comment after a value)
#   * one or more  [target]  sections follow the header
#
# SAFETY: planning is offline. The engine sends live traffic ONLY if you add
# --allow-network AND a target has a real network_address in scope. With the
# values below you can plan and dry-run safely without touching any network.
# -----------------------------------------------------------------------------

# --- Who authorized this, and what it is ------------------------------------
# engagement_id: any label you like, unique per job.
engagement_id=eng-2026-demo
# authorized_by: the person who signed off.
authorized_by=jane.doe
# authorized_by_role: must be exactly SecurityAdmin.
authorized_by_role=SecurityAdmin

# --- When the work is allowed to happen (Unix epoch seconds) -----------------
# The engine refuses to run outside this window. The wide range below is fine
# for experimenting; tighten it for a real engagement.
# Tip: `date +%s` prints "now" in epoch seconds.
time_window_start=0
time_window_end=4102444800

# --- Scope: what may be touched, and what must never be ----------------------
# in_scope_targets must list every target id used in the [target] sections
# below (comma-separated, no spaces).
in_scope_targets=api-staging,web-staging

# deny_list_targets (optional): ids that must never be tested, even if listed.
deny_list_targets=prod-ledger

# --- What kinds of testing are approved (comma-separated) --------------------
# Pick from: PassiveRecon, ConfigurationAudit, Sast, Dast, ApiSecurity,
#            DependencyAudit, CloudPosture, ContainerPosture, SecretScan,
#            MalwareScan, ThreatModeling, AttackPathAnalysis,
#            ExploitValidationSandboxed, AndroidStaticAnalysis, MobileRuntime
# This set covers the two example targets below (an Api and a WebApp). Trim it
# to only what you are authorized for on a real engagement.
allowed_techniques=PassiveRecon,ConfigurationAudit,ApiSecurity,Dast

# --- How hard the engine may push -------------------------------------------
# max_intensity: one of Passive, Standard, Aggressive.
max_intensity=Standard
# high_impact_approved: true only with explicit sign-off.
high_impact_approved=false
# penetrative_testing_approved: allow exploitation-class techniques.
penetrative_testing_approved=true

# =============================================================================
# Targets (repeat the [target] block for each asset)
# =============================================================================

# id must appear in in_scope_targets above.
# target_type examples: Api, WebApp.
# criticality: 1 (low) .. 5 (crown jewels).
# network_address is OPTIONAL. Leave it commented to keep the target
# label-only (safe for planning/experiments). Add a real IP/hostname ONLY when
# you intend to run live tools against it with --allow-network.
[target]
id=api-staging
target_type=Api
criticality=4
# network_address=192.168.56.10

[target]
id=web-staging
target_type=WebApp
criticality=3
# network_address=192.168.56.20
